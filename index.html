<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Didgeridoo 1.2</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg1: #100c09; --bg2: #2a1c13; --text: #f3ece2; --muted: #a99c8c;
    --accent: #e9a04e; --panel: rgba(255, 255, 255, .05); --line: rgba(255, 255, 255, .13);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100dvh;
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 72%);
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  header { position: relative; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 16px 16px 0; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: .3em; font-size: 13px; text-transform: uppercase; color: var(--muted); position: absolute; left: 20px; top: 18px; }
  #lang {
    position: absolute; right: 16px; top: 14px; z-index: 4;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #lang option, #lang optgroup { background: var(--bg2); color: var(--text); }
  #info { text-align: center; min-width: 260px; }
  #name { font-size: 24px; font-weight: 300; }
  #meta { color: var(--accent); font-size: 13px; letter-spacing: .04em; margin-top: 2px; }
  #mood { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .nav {
    width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 24px; cursor: pointer; display: grid; place-items: center;
  }
  .nav:hover { background: rgba(255, 255, 255, .12); }
  #stage { flex: 1; min-height: 130px; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  #strip { position: relative; display: flex; gap: 6px; padding: 0 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  #marker {
    position: absolute; top: -7px; width: 0; height: 0; margin-left: -6px; pointer-events: none;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--accent);
    opacity: .35; transition: opacity .15s;
  }
  body.blowing #marker { opacity: 1; }
  .btn {
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font: inherit; cursor: pointer; padding: 6px 4px; min-height: 48px;
  }
  .btn b { font-size: 14px; font-weight: 600; color: var(--accent); pointer-events: none; }
  .btn span { font-size: 11px; color: var(--muted); white-space: nowrap; pointer-events: none; }
  .btn.lit, .btn[aria-pressed="true"] { background: rgba(233, 160, 78, .3); border-color: var(--accent); }
  .btn.lit span, .btn[aria-pressed="true"] span { color: var(--text); }
  #strip .btn { flex: 1; min-height: 56px; }
  #strip .btn span { font-size: 15px; color: var(--text); }
  #fx, #modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px 16px 0; }
  #fx .btn { width: 86px; } #fx .btn b { color: #8fd3b0; }
  #modes .btn { min-width: 150px; flex-direction: row; gap: 8px; min-height: 40px; }
  #modes .btn b { color: #c9a9e6; }
  #modes .btn span { font-size: 13px; }
  /* Ritme uit Song Library */
  #songBar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 8px 16px 0; }
  #songBar[hidden] { display: none; }
  #songBar select, #songBar button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  #songBar select { max-width: 55vw; } #songBar option, #songBar optgroup { background: #1c1712; }
  #songBar button.on { background: rgba(255, 77, 77, .25); border-color: #ff4d4d; }
  #songStatus { font-size: 13px; color: var(--muted); min-width: 140px; text-align: center; }
  #songStatus.good { color: #8fd3b0; } #songStatus.bad { color: #ff7a7a; }
  #songHint { width: 100%; text-align: center; font-size: 12px; color: var(--muted); }
  .btn.target { background: rgba(255, 70, 70, .35) !important; border-color: #ff4d4d !important; box-shadow: 0 0 0 2px rgba(255, 77, 77, .5); }
  .btn.next { border-color: #ff9a8a !important; border-style: dashed; }
  #controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; padding: 10px 16px 4px; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  footer { display: flex; justify-content: space-between; gap: 12px; padding: 6px 16px 10px; font-size: 12px; color: var(--muted); opacity: .8; }
  footer b { color: var(--text); font-weight: 600; }
  footer a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  footer a:hover { text-decoration: underline; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 760px) {
    header h1 { display: none; }
    header { padding-top: 50px; gap: 10px; }
    #info { min-width: 0; } #name { font-size: 20px; }
    #fx .btn { width: calc(33.3% - 4px); }
    #modes .btn { min-width: 0; flex: 1; }
    footer #keys { display: none; }
    footer { justify-content: center; }
    input[type=range] { width: 84px; }
  }
  @media (max-height: 620px) { .btn { min-height: 38px; } #strip .btn { min-height: 44px; } #mood { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Didgeridoo 1.2</h1>
  <button class="nav" id="prev">‹</button>
  <div id="info"><div id="name"></div><div id="meta"></div><div id="mood"></div></div>
  <button class="nav" id="next">›</button>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="nl">Nederlands</option>
    <optgroup label="More languages">
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </optgroup>
  </select>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="strip"><div id="marker"></div></div>
<div id="fx"></div>
<div id="modes"></div>

<div id="songBar" hidden>
  <select id="songSel" aria-label="Song"></select>
  <button id="songListen"></button>
  <button id="songPractice"></button>
  <button id="songStop">■</button>
  <span id="songStatus"></span>
  <span id="songHint"></span>
</div>

<div id="controls">
  <label><span data-t="volume"></span> <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  <label><span data-t="reverb"></span> <input type="range" id="verb" min="0" max="1" step="0.01" value="0.25"></label>
  <label><span data-t="tempo"></span> <input type="range" id="tempo" min="60" max="150" step="1" value="96"></label>
  <label><input type="checkbox" id="phoneSpk"> <span data-t="phoneSpk"></span></label>
</div>

<footer>
  <span id="keys" data-t="keys"></span>
  <span><a href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener" data-t="donate"></a> · Didgeridoo 1.2</span>
</footer>

<script src="songs.js"></script>
<script>
// ---------- Didgeridoos, van laag naar hoog ----------
// f = grondtoon (drone), toot = verhouding van de overblaastoon, cm = lengte bij benadering
const DIDGES = [
  { note: 'B1', f: 61.74, cm: 157, toot: 2.58, bright: .8,  wood: ['#6b4630', '#2a1a11'], paint: ['#efe3c8', '#a8452a', '#17110d', '#d9a441'] },
  { note: 'C2', f: 65.41, cm: 148, toot: 2.6,  bright: .9,  wood: ['#7a4f2c', '#33200f'], paint: ['#f1e6cf', '#17110d', '#c9622b', '#8a2f1d'] },
  { note: 'D2', f: 73.42, cm: 132, toot: 2.62, bright: 1,   wood: ['#8a5a33', '#3a2413'], paint: ['#f3ead6', '#b5482a', '#1b1410', '#e0b04c'] },
  { note: 'E2', f: 82.41, cm: 118, toot: 2.65, bright: 1.1, wood: ['#9b6a3f', '#44290f'], paint: ['#1b1410', '#f3ead6', '#d9a441', '#9c3a22'] },
  { note: 'F2', f: 87.31, cm: 110, toot: 2.68, bright: 1.2, wood: ['#a3713f', '#4a2e14'], paint: ['#f5efe0', '#c9622b', '#2a1a11', '#6f8f5a'] },
  { note: 'G2', f: 98.0,  cm: 98,  toot: 2.7,  bright: 1.3, wood: ['#b07d48', '#523416'], paint: ['#9c3a22', '#f3ead6', '#17110d', '#e0b04c'] },
];

// Mondstanden: eerste en tweede formant per klinker (oe – o – a – è – ie)
const VOW = [[300, 760], [430, 920], [720, 1180], [520, 1750], [310, 2250]];
const VOW_KEYS = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG'];
const FX = [['KeyZ', 'toot'], ['KeyX', 'bark'], ['KeyC', 'howl'], ['KeyV', 'growl'], ['KeyJ', 'ta'], ['KeyK', 'wah']];
const MODES = [['KeyW', 'keep'], ['KeyR', 'rhythm'], ['Escape', 'stop']];
// Ritme in achtsten: [mondstand, accent]
const PATTERN = [[0, 'ta'], [2], [4], [2], [0, 'wah'], [1], [4, 'ta'], [1], [0, 'ta'], [2], [4], [3], [0, 'wah'], [4, 'ta'], [2], [1, 'wah']];

// ---------- Talen ----------
const KEYS = (blow, mouth, fx, acc, keep, rhythm, didge) =>
  `<b>${blow}</b> · <b>A–G</b> = ${mouth} · <b>Z X C V</b> = ${fx} · <b>J K</b> = ${acc} · <b>W</b> = ${keep} · <b>R</b> = ${rhythm} · <b>&lt; &gt;</b> = ${didge}`;
const LANGS = {
  en: {
    prev: 'Previous didgeridoo (< or ←)', next: 'Next didgeridoo (> or →)',
    volume: 'Volume', reverb: 'Reverb', tempo: 'Tempo', space: 'Space', phoneSpk: 'Phone speaker',
    vowels: ['oo', 'oh', 'ah', 'eh', 'ee'],
    fx: { toot: 'Toot', bark: 'Bark', howl: 'Howl', growl: 'Growl', ta: 'Ta', wah: 'Wah' },
    modes: { keep: 'Keep droning', rhythm: 'Rhythm', stop: 'Silence' },
    keys: KEYS('Space = blow', 'mouth shape', 'toot, bark, howl, growl', 'accents', 'keep droning', 'rhythm', 'didgeridoo'),
    donate: '☕ Buy me a coffee', more: 'More languages',
    names: ['Low B', 'Deep C', 'Classic D', 'Warm E', 'Bright F', 'High G'],
    moods: ['Very deep and slow, for stillness and grounding', 'Dark and full, a calm drone for meditation', 'The all-rounder most players start with',
      'Lively and clear, good for rhythm', 'Bright and quick, easy to play fast', 'Short and high, for sharp rhythms'],
  },
  nl: {
    prev: 'Vorige didgeridoo (< of ←)', next: 'Volgende didgeridoo (> of →)',
    volume: 'Volume', reverb: 'Galm', tempo: 'Tempo', space: 'Spatie', phoneSpk: 'Telefoonspeaker',
    vowels: ['oe', 'oo', 'aa', 'è', 'ie'],
    fx: { toot: 'Toeter', bark: 'Blaf', howl: 'Huil', growl: 'Grom', ta: 'Ta', wah: 'Wah' },
    modes: { keep: 'Laten doorspelen', rhythm: 'Ritme', stop: 'Stilte' },
    keys: KEYS('Spatie = blazen', 'mondstand', 'toeter, blaf, huil, grom', 'accenten', 'laten doorspelen', 'ritme', 'didgeridoo'),
    donate: '☕ Trakteer me op een koffie', more: 'Meer talen',
    names: ['Lage B', 'Diepe C', 'Klassieke D', 'Warme E', 'Heldere F', 'Hoge G'],
    moods: ['Heel diep en traag, voor stilte en aarding', 'Donker en vol, een rustige drone voor meditatie', 'De allrounder waar de meeste spelers mee beginnen',
      'Levendig en helder, goed voor ritme', 'Helder en vlot, makkelijk snel te spelen', 'Kort en hoog, voor scherpe ritmes'],
  },
  de: {
    prev: 'Vorheriges Didgeridoo (< oder ←)', next: 'Nächstes Didgeridoo (> oder →)',
    volume: 'Lautstärke', reverb: 'Hall', tempo: 'Tempo', space: 'Leertaste', phoneSpk: 'Handylautsprecher',
    vowels: ['u', 'o', 'a', 'ä', 'i'],
    fx: { toot: 'Tröte', bark: 'Bellen', howl: 'Heulen', growl: 'Knurren', ta: 'Ta', wah: 'Wah' },
    modes: { keep: 'Weiterspielen', rhythm: 'Rhythmus', stop: 'Stille' },
    keys: KEYS('Leertaste = blasen', 'Mundstellung', 'Tröte, Bellen, Heulen, Knurren', 'Akzente', 'weiterspielen', 'Rhythmus', 'Didgeridoo'),
    donate: '☕ Spendier mir einen Kaffee', more: 'Weitere Sprachen',
    names: ['Tiefes H', 'Tiefes C', 'Klassisches D', 'Warmes E', 'Helles F', 'Hohes G'],
    moods: ['Sehr tief und langsam, für Stille und Erdung', 'Dunkel und voll, ein ruhiger Bordun für die Meditation', 'Der Allrounder, mit dem die meisten anfangen',
      'Lebendig und klar, gut für Rhythmen', 'Hell und flink, leicht schnell zu spielen', 'Kurz und hoch, für scharfe Rhythmen'],
  },
  fr: {
    prev: 'Didgeridoo précédent (< ou ←)', next: 'Didgeridoo suivant (> ou →)',
    volume: 'Volume', reverb: 'Réverb', tempo: 'Tempo', space: 'Espace', phoneSpk: 'Haut-parleur du téléphone',
    vowels: ['ou', 'o', 'a', 'è', 'i'],
    fx: { toot: 'Trompe', bark: 'Aboiement', howl: 'Hurlement', growl: 'Grognement', ta: 'Ta', wah: 'Wah' },
    modes: { keep: 'Laisser jouer', rhythm: 'Rythme', stop: 'Silence' },
    keys: KEYS('Espace = souffler', 'forme de la bouche', 'trompe, aboiement, hurlement, grognement', 'accents', 'laisser jouer', 'rythme', 'didgeridoo'),
    donate: '☕ Offrez-moi un café', more: 'Autres langues',
    names: ['Si grave', 'Do profond', 'Ré classique', 'Mi chaleureux', 'Fa clair', 'Sol aigu'],
    moods: ['Très grave et lent, pour le calme et l’ancrage', 'Sombre et plein, un bourdon calme pour méditer', 'Le polyvalent avec lequel la plupart commencent',
      'Vif et clair, idéal pour le rythme', 'Clair et rapide, facile à jouer vite', 'Court et aigu, pour des rythmes nets'],
  },
  es: {
    prev: 'Didgeridoo anterior (< o ←)', next: 'Didgeridoo siguiente (> o →)',
    volume: 'Volumen', reverb: 'Reverb', tempo: 'Tempo', space: 'Espacio', phoneSpk: 'Altavoz del móvil',
    vowels: ['u', 'o', 'a', 'e', 'i'],
    fx: { toot: 'Trompeta', bark: 'Ladrido', howl: 'Aullido', growl: 'Gruñido', ta: 'Ta', wah: 'Wah' },
    modes: { keep: 'Dejar sonar', rhythm: 'Ritmo', stop: 'Silencio' },
    keys: KEYS('Espacio = soplar', 'forma de la boca', 'trompeta, ladrido, aullido, gruñido', 'acentos', 'dejar sonar', 'ritmo', 'didgeridoo'),
    donate: '☕ Invítame a un café', more: 'Más idiomas',
    names: ['Si grave', 'Do profundo', 'Re clásico', 'Mi cálido', 'Fa brillante', 'Sol agudo'],
    moods: ['Muy grave y lento, para la calma y el arraigo', 'Oscuro y lleno, un bordón tranquilo para meditar', 'El todoterreno con el que casi todos empiezan',
      'Vivo y claro, bueno para el ritmo', 'Brillante y ágil, fácil de tocar rápido', 'Corto y agudo, para ritmos marcados'],
  },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('didge.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('didge.' + k, JSON.stringify(v)); } catch {} },
};
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Toestand ----------
let idx = clamp(store.get('didge', 2), 0, DIDGES.length - 1);
const cur = () => DIDGES[idx];
const held = new Set();          // alles wat nu blaast: toetsen en vingers
let vowStack = [];               // ingedrukte mondstand-toetsen, laatste wint
let vow = 1;                     // huidige mondstand, 0..4 (traploos)
let latch = false, rhythmOn = false, tooting = false, growling = false;
const blowing = () => held.size > 0 || latch || rhythmOn;

// ---------- Audio ----------
let ctx, master, bus, wet, an, anBuf, noiseBuf;
// Telefoonspeaker-modus: kleine speakers kunnen de grondtoon (62-98 Hz) niet maken en gaan dan rammelen.
// Dan filteren we die weg en laten de boventonen de toonhoogte dragen.
const isPhone = () => /Android|iPhone/i.test(navigator.userAgent) && Math.min(screen.width, screen.height) < 600;
let phoneSpk = store.get('phoneSpk', isPhone());
let comp, hp1, hp2, pres, trim, subG;
let lip, breath, sum, bp1, bp2, bp3, g2, bodyLP, lipO = [], sub, voice, voiceG, tootO = [], tootG, tootStart = 0;

function initAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new AudioContext({ latencyHint: 'interactive' });
  const G = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const O = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; };
  const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };

  master = G(0);
  comp = ctx.createDynamicsCompressor();
  hp1 = F('highpass', 10, .7); hp2 = F('highpass', 10, .7); pres = F('peaking', 650, 1); trim = G(1);
  master.connect(hp1).connect(hp2).connect(pres).connect(trim).connect(comp).connect(ctx.destination);
  an = ctx.createAnalyser(); an.fftSize = 1024; anBuf = new Float32Array(an.fftSize); comp.connect(an);
  bus = G(1);
  bus.connect(G(.9)).connect(master);
  const conv = ctx.createConvolver(); conv.buffer = impulse(2.6);
  wet = G(0); bus.connect(conv).connect(wet).connect(master);

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true; noise.start();

  const f = cur().f;
  sum = G(1);
  const tubeIn = G(1);
  // Lippen: twee zaagtanden die net niet gelijk lopen, plus een zuivere grondtoon
  lip = G(0);
  lipO = [O('sawtooth', f), O('sawtooth', f)];
  sub = O('sine', f);
  lipO[0].connect(G(.5)).connect(lip); lipO[1].connect(G(.3)).connect(lip); subG = G(.45); sub.connect(subG).connect(lip);
  lip.connect(tubeIn);
  // Stem door de buis: blaf, huil en grom
  voice = O('sawtooth', f * 1.5); voiceG = G(0);
  voice.connect(voiceG).connect(tubeIn); voiceG.connect(G(.25)).connect(sum);
  // De buis: lage romp, twee meebewegende mondformanten en één vaste buisresonantie
  bodyLP = F('lowpass', f * 3.2, .8); bp1 = F('bandpass', 430, 5); bp2 = F('bandpass', 920, 8); bp3 = F('bandpass', f * 2.6, 5);
  g2 = G(5);
  tubeIn.connect(bodyLP).connect(G(.75)).connect(sum);
  tubeIn.connect(bp1).connect(G(2.4)).connect(sum);
  tubeIn.connect(bp2).connect(g2).connect(sum);
  tubeIn.connect(bp3).connect(G(1.2)).connect(sum);
  breath = G(0);
  noise.connect(F('bandpass', 1500, .6)).connect(breath).connect(sum);
  // Toeter: de overblaastoon, de lippen springen naar de volgende resonantie
  tootO = [O('sawtooth', f * 2.6), O('sawtooth', f * 2.6)]; tootO[1].detune.value = 9;
  tootG = G(0);
  const tootLP = F('lowpass', 1500, 1.2);
  tootO[0].connect(tootLP); tootO[1].connect(tootLP); tootLP.connect(tootG).connect(sum);

  const shaper = ctx.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 1.6);
  shaper.curve = curve; shaper.oversample = '2x';
  sum.connect(shaper).connect(G(.42)).connect(bus);
  tune(); setVowel(vow); applyPhone();
}

function impulse(sec) {
  const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return buf;
}
function applyMix() {
  if (!ctx) return;
  master.gain.setTargetAtTime(+vol.value, ctx.currentTime, .05);
  wet.gain.setTargetAtTime(+verb.value * .9 * (phoneSpk ? .6 : 1), ctx.currentTime, .05);
}
function applyPhone() {
  if (!ctx) return;
  const t = ctx.currentTime, on = phoneSpk;
  hp1.frequency.setTargetAtTime(on ? 180 : 10, t, .02); hp2.frequency.setTargetAtTime(on ? 180 : 10, t, .02);
  pres.gain.setTargetAtTime(on ? 4 : 0, t, .02);
  trim.gain.setTargetAtTime(on ? .75 : 1, t, .02);
  subG.gain.setTargetAtTime(on ? .1 : .45, t, .02);
  comp.threshold.value = on ? -20 : -14; comp.ratio.value = on ? 6 : 4;
  applyMix();
}
// Toekomstige automatisering wissen zonder dat de waarde verspringt
const hold = (p, t) => { if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else p.cancelScheduledValues(t); };

function tune() {
  if (!ctx) return;
  const d = cur(), t = ctx.currentTime;
  [...lipO, sub].forEach(o => o.frequency.setTargetAtTime(d.f, t, .04));
  if (growling) voice.frequency.setTargetAtTime(d.f * 1.5, t, .04);
  tootO.forEach(o => o.frequency.setTargetAtTime(d.f * d.toot, t, .04));

const SONGS = LIB ? LIB.songs.map(([id, cat, bpm, str]) => {
  const items = str.split(' ').map(tok => { const [n, d] = tok.split(':'); return { n, rest: n === 'R', beats: d ? +d : 1 }; });
  const m = items.filter(x => !x.rest).map(x => noteMidi(x.n)), lo = Math.min(...m), hi = Math.max(...m);
  // Slag per noot: 'toot' of 'ta'
  return { id, cat, bpm, items, hits: m.map(x => (hi - lo >= 3 && x >= lo + (hi - lo) * 2 / 3 ? 'toot' : 'ta')) };
}) : [];
const HIT_KEY = { toot: 'KeyZ', ta: 'KeyJ' };
const song = { mode: 'idle', sg: null, pos: 0, misses: 0, timers: [] };
const songName = (id) => (LIB.names[lang] || {})[id] || LIB.names.en[id];
function songStatus(t, c) { $('songStatus').textContent = t; $('songStatus').className = c || ''; }
function songMark() {
  Object.values(btnEls).forEach(b => b.classList.remove('target', 'next'));
  if (song.mode === 'idle') return;
  const now = song.sg.hits[song.pos], nxt = song.sg.hits[song.pos + 1];
  if (song.mode === 'practice' && nxt && nxt !== now) btnEls[HIT_KEY[nxt]].classList.add('next');
  if (now) btnEls[HIT_KEY[now]].classList.add('target');
}
function songButtons() {
  $('songListen').textContent = sTxt().listen; $('songPractice').textContent = sTxt().practice; $('songStop').title = sTxt().stop; $('songHint').textContent = sTxt().hint;
  $('songListen').classList.toggle('on', song.mode === 'listen'); $('songPractice').classList.toggle('on', song.mode === 'practice');
}
function songStop(quiet) {
  song.timers.forEach(clearTimeout); song.timers = [];
  if (song.mode !== 'idle') { blowOff('song'); if (latch) keep(false); }
  song.mode = 'idle'; songMark(); songButtons();
  if (!quiet) songStatus(sTxt().pick);
}
function songProgress() { songStatus(`${sTxt().note} ${Math.min(song.pos + 1, song.sg.hits.length)} ${sTxt().of} ${song.sg.hits.length}`); }
function songPrepare() { const sg = SONGS[+$('songSel').value]; if (!sg) return false; Object.assign(song, { sg, pos: 0, misses: 0 }); return true; }
function songPractice() {
  initAudio(); songStop(true); if (!songPrepare()) return;
  song.mode = 'practice'; keep(true);          // de grondtoon klinkt door, jij speelt de slagen
  songMark(); songButtons(); songProgress();
}
function songListen() {
  initAudio(); songStop(true); if (!songPrepare()) return;
  song.mode = 'listen'; blowOn('song');
  songMark(); songButtons(); songProgress();
  const beat = 60 / song.sg.bpm * 1000;
  let at = 300, k = 0;
  song.sg.items.forEach(x => {
    if (!x.rest) {
      const n = k++;
      song.timers.push(setTimeout(() => {
        song.pos = n; songMark(); songProgress();
        if (song.sg.hits[n] === 'toot') { tootOn(); song.timers.push(setTimeout(tootOff, Math.min(400, x.beats * beat * .7))); }
        else accent('ta');
      }, at));
    }
    at += x.beats * beat;
  });
  song.timers.push(setTimeout(() => songStop(), at + 400));
}
function songHit(kind) {
  if (song.mode !== 'practice') return;
  if (kind === song.sg.hits[song.pos]) {
    song.pos++;
    if (song.pos >= song.sg.hits.length) { const m = song.misses; songStop(true); songStatus(`${sTxt().done} ${m}`, 'good'); return; }
    songMark(); songProgress();
  } else if (kind === 'toot' || kind === 'ta') { song.misses++; songStatus(sTxt().miss, 'bad'); }
}
// Toeter en tongslag (knop of toets) tellen mee bij het oefenen
const baseToot = FX_ACT.toot[0], baseTa = FX_ACT.ta[0];
FX_ACT.toot[0] = () => { baseToot(); songHit('toot'); };
FX_ACT.ta[0] = () => { baseTa(); songHit('ta'); };
function songLabels() {
  if (!LIB) return;
  $('songBar').hidden = false;
  const sel = $('songSel'), v = sel.value || store.get('song', '');
  sel.innerHTML = '';
  LIB.cats.forEach(cat => {
    const g = document.createElement('optgroup');
    g.label = (LIB.catNames[lang] || LIB.catNames.en)[cat];
    SONGS.forEach((sg, i) => { if (sg.cat === cat) g.appendChild(new Option('🎵 ' + songName(sg.id), i)); });
    sel.appendChild(g);
  });
  if (v !== '') sel.value = v;
  songButtons(); songMark();
  if (song.mode === 'idle') songStatus(sTxt().pick);
}
const baseApplyLang = applyLang;
applyLang = function () { baseApplyLang(); songLabels(); };
$('songSel').onchange = () => { store.set('song', $('songSel').value); songStop(); $('songSel').blur(); };
$('songListen').onclick = songListen;
$('songPractice').onclick = songPractice;
$('songStop').onclick = () => songStop();

applyLang();
// Openen vanuit Song Library: index.html?song=<id>&mode=practice|listen
window.openSong = function (id, mode) { const i = SONGS.findIndex(sg => sg.id === id); if (i < 0) return; $('songSel').value = i; mode === 'listen' ? songListen() : songPractice(); };
{ const q = new URLSearchParams(location.search); if (q.get('song')) openSong(q.get('song'), q.get('mode')); }
requestAnimationFrame(draw);
</script>
</body>
